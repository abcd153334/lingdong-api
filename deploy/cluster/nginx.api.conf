# 灵动 API · 纯 API 节点入口（无任何前端）
#
# 这份配置只做两件事：终止明文请求（TLS 由外层 443 或本机证书负责）、把请求转给后端。
# **它不维护 API 路径白名单**：哪些路径可用由后端 `LD_NODE_MODE=api` 的允许表裁决
# （middleware.APISurfaceOnly）。nginx 再抄一份清单，必然与路由表漂移 ——
# 新增端点漏在 nginx 侧是静默 404，漏在后端侧是意外暴露。
#
# 唯一的路径规则是根路径不打到后端：打开域名直接 404，连一个 JSON 都不返回。
#
# 需要 ACME HTTP-01 签发证书时，另加一段：
#   location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

server {
    listen 80;
    server_name _;

    # 不暴露 nginx 版本号（响应头 Server: nginx/1.29.x 是资产指纹）
    server_tokens off;

    # 与后端上限对齐：/v1/images/edits 走 multipart、/v1/files 传原图。
    # nginx 默认只收 1 MiB，超出会在这一层 413（后端日志里什么都看不到）。
    client_max_body_size 32m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 根路径与目录索引：完全不可访问。
    location = / {
        return 404;
    }

    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # 原始域名：后端据此把 icon_url / 产物直链换成用户实际访问的这条线路。
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 本机 nginx 是唯一一跳：覆盖而非追加，避免客户端自带的 XFF 被采信。
        # 前面还有 CDN/SLB 时改成 $proxy_add_x_forwarded_for，并把该网段写进 LD_TRUSTED_PROXIES。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时阶梯：客户端 ≥900s > 这里 960s > 应用 780s > 单次上游 60s。
        # 同步图像在等待期一个字节都不写，任何一层按默认 60s 都会先断。
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;
        proxy_connect_timeout 15s;

        # SSE 与长等待不要缓冲；大文件上传不要先落盘再转发。
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
