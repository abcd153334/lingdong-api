# 灵动 API · 多机节点编排（一主站 + N 线路，共用一个库与一个 Redis）
#
# 用法（每台机器执行，项目名区分节点）：
#   主站/完整节点：docker compose -p ld-main --profile full up -d
#   线路/纯 API ：docker compose -p ld-hk   --profile api  up -d
#
# 与单机编排（deploy/docker-compose.yml）的区别：
#   - 不启动 PostgreSQL / Redis：它们是外部共享依赖，地址由 .env 给；
#   - 不挂本地存储卷：多节点共库时文件必须在对象存储里（LD_CLUSTER_MODE=1 会强制）；
#   - 不写 container_name：同一台机器要能跑多套（`-p` 即隔离）；
#   - 镜像用精确 TAG：多节点滚动升级时不能出现"一半新一半 latest"。
#
# 配置只有一个入口：deploy/.env（env_file 整份注入）。本文件只保留
# 「缺了必须报错」的检查与两处节点默认值，不再逐项抄写变量。

services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/backend.Dockerfile
    image: "lingdong-api-backend:${TAG:?TAG 必须显式指定（禁止 latest）}"
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # 外部依赖：这里不给默认值，避免"忘了配就连本机 localhost"。
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL 必须指向共享主库}"
      REDIS_ADDR: "${REDIS_ADDR:?REDIS_ADDR 必须指向共享 Redis}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD 必须显式配置}"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY 必须与其它节点同值}"
      # 节点角色必须显式声明：主站 full、线路 api。
      # 不给默认值，是因为"用 api profile 却忘了改模式"会让后端继续提供门户接口。
      LD_NODE_MODE: "${LD_NODE_MODE:?必须显式写 full 或 api}"
      # 注意：没有 GIN_MODE —— 它不是可配置项，gin 模式由 APP_ENV 强制决定。
      # 本编排的 nginx 与服务同处 172.28.0.0/24：直接信任该网段，
      # 省掉每台机器手算反代 IP（前面再加 CDN/SLB 时在 .env 里覆盖成更窄的网段）。
      LD_TRUSTED_PROXIES: "${LD_TRUSTED_PROXIES:-172.28.0.0/24}"
      # 集群模式禁用本地盘；这里保留路径只为让 conf 的默认值有落点。
      STORAGE_DIR: "/app/data"
    expose:
      - "8080"
    healthcheck:
      # deep=1 会真的探 DB 与 Redis：进程活着但依赖全挂时，容器不该继续报 healthy。
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8080/api/health?deep=1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 6s
      retries: 6
      # 首启要跑迁移与种子；多节点同时启动时后到的节点还要等 advisory lock。
      start_period: 180s
    # 先停 HTTP 再停 Worker；长请求按断连处理（不结算）。
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - edge

  # 完整节点：静态资源 + 反代（门户、管理台、文档站都在这里）
  web:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: deploy/web.Dockerfile
    image: "lingdong-api-web:${TAG:?TAG 必须显式指定（禁止 latest）}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EDGE_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - edge

  # 纯 API 节点：只有 nginx，镜像里没有任何前端产物；未登记路径由后端 404。
  edge:
    profiles: ["api"]
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.api.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${EDGE_PORT:-80}:80"
    healthcheck:
      # 根路径恒 404 才是"纯 API"的正确状态；因此探 /api/health 而不是 /。
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - edge

networks:
  edge:
    driver: bridge
    ipam:
      config:
        # 固定网段：LD_TRUSTED_PROXIES 的默认值依赖它（本机 nginx → 后端）。
        # 每台机器一个 compose 项目，跨主机不冲突；同机跑多套时用 -p 区分并各自改网段。
        - subnet: 172.28.0.0/24
