# 灵动 API · web 站点配置（挂载为 /etc/nginx/conf.d/default.conf）
# 职责：静态资源服务 + /api、/v1、/f/ 反向代理到 backend:8080 + SPA history fallback
#
# TLS 终止**不在这一层**：本文件监听 80，供容器内/内网反代使用。
# 对外必须由边缘入口（反向代理或云 LB）提供 443 + 80→443 跳转，
# 否则会话 Cookie、登录口令、CSRF 令牌全程明文（CookieSecure 在 prod 为 true，
# 明文链路下浏览器会直接丢弃 Cookie，表现为"登录成功但立刻掉线"）。
#
# 客户端 IP 的传递规则（改这一行前先读）：
#   - 本层用 `$proxy_add_x_forwarded_for`（**追加**）把上游给的链保留下来；
#   - backend 用 `LD_TRUSTED_PROXIES` 声明"哪些地址是可信代理"，
#     gin 从右往左取第一个不受信任的地址作为客户端 IP；
#   - 因此**边缘与本层所在网段都要在 LD_TRUSTED_PROXIES 里**。
#     少配这段：所有用户塌进同一个限流桶；配成 0.0.0.0/0：任何人可伪造来源 IP。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不暴露 nginx 版本号（响应头 Server: nginx/1.27.x 是资产指纹）
    server_tokens off;

    # 压缩。官方 nginx 镜像默认 `gzip off`：构建产物里最大的那个 chunk 有 1.79MB，
    # 原样传输就是白白多传 1.3MB 以上（实测响应里既无 Content-Encoding，也没变短）。
    #
    # 为什么不用 `gzip_static on`：镜像里只有 vite 产出的原文件，没有预压缩的 .gz。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript
        text/css
        application/json
        application/manifest+json
        image/svg+xml
        text/plain;

    # 基础安全响应头。CSP 未加：SPA 内联样式与动态资源较多，盲加会白屏，
    # 需要单独评估后再上（管理台最值得加，且应带 nonce）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # nginx 默认只收 1 MiB，而 /v1/images/edits 走 multipart、/v1/files 直接传原图：
    # 不放开的话，超过 1 MiB 的参考图会被 nginx 自己 413 掉（后端根本没收到请求，
    # 日志里只有一行 413，排查时会误以为是业务校验拒绝）。
    #
    # 取值必须 ≥ system_config.uploads 的最大单类上限 + 1 MiB 表单开销：
    # 出厂 video=200MB → 后端 RequestCap=201MiB，所以这里 256m。
    # **四处必须同值**（本文件、cluster/nginx.api.conf、edge/nginx/snippets/timeouts.conf、
    # edge/frp/*.proxy.conf.example）—— 不同值的表现是"换条线路就传不上去"。
    client_max_body_size 256m;

    # 构建产物：带内容哈希的资源长缓存
    #
    # 只用 `expires 1y`：nginx 会自动发 `Expires` + `Cache-Control: max-age=31536000`。
    # 这里**绝不能再写 add_header Cache-Control**（历史写法是 "public, immutable"）：
    #   ① 双份 Cache-Control 头（实测响应里两条并存），中间层各取一条，语义不确定；
    #   ② 更严重 —— location 里只要出现 add_header，server 级那三条安全响应头就
    #      **整体不再继承**，实测 /assets/*.js 上没有 nosniff。资产少一个 immutable
    #      无所谓，丢 nosniff 等于把「脚本被嗅探成 HTML 执行」的门打开。
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # 管理面 / 门户 API → backend:8080
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 原始域名：多线路部署下后端据此判断“这次请求从哪条线路进来”，
        # 从而把 icon_url / 产物直链 / 文档示例里的 origin 换成用户实际访问的那条。
        # 没有这一行，所有响应都会退回配置里的第一条地址（跨线路拉图、跨线路下载）。
        #
        # 必须是 $http_host，**不能是 $host**：$host 会把端口砍掉。
        # 站在 8081 这类非 80/443 端口上时，后端据此推出的 origin 是 http://ip，
        # 而 CSRF 的「完整 origin 比对」拿到的是浏览器发的 http://ip:8081，必然不等
        # —— 登录直接 403「请求来源校验失败」（真机就是这么撞出来的）。
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # 追加：保留上游真实客户端 IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # 网关转发（含 SSE 流式）→ backend:8080
    #
    # proxy_read_timeout 必须**严格大于**应用层的同步等待上限
    # （默认 780s，LD_DUOMI_SYNC_IMAGE_WAIT_SEC 可调到 900s 上限），
    # 否则 nginx 会先于应用断开，客户端拿到的是 nginx 的 504 HTML 页面：
    # 「上游已出图、平台也结算成功，用户却只看到 504」正是这么来的。
    # 两者相等也不行 —— 同一时刻到点，谁先谁后全靠运气。
    #
    # 同步图像（gpt-image 实测单张 540s+）一个字节都不会在等待期间写出，
    # 所以这里只能靠加大读超时，不能靠心跳。
    # 调大应用侧上限（LD_DUOMI_SYNC_IMAGE_WAIT_SEC）时**同步调大这里**。
    location /v1/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 原始域名：多线路部署下后端据此判断“这次请求从哪条线路进来”，
        # 从而把 icon_url / 产物直链 / 文档示例里的 origin 换成用户实际访问的那条。
        # 没有这一行，所有响应都会退回配置里的第一条地址（跨线路拉图、跨线路下载）。
        #
        # 必须是 $http_host，**不能是 $host**：$host 会把端口砍掉。
        # 站在 8081 这类非 80/443 端口上时，后端据此推出的 origin 是 http://ip，
        # 而 CSRF 的「完整 origin 比对」拿到的是浏览器发的 http://ip:8081，必然不等
        # —— 登录直接 403「请求来源校验失败」（真机就是这么撞出来的）。
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # 追加：保留上游真实客户端 IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;
        proxy_buffering off;
        # 流式（SSE）必须不压缩：gzip 会攒够一个块才吐字节，把「逐字返回」
        # 变成「卡几秒再一次性出来」，看起来就是流断了。这里显式关掉，
        # 不依赖 server 级 gzip 的类型白名单未来是否被扩大。
        gzip off;
    }

    # 文件域直链 → backend:8080
    location /f/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 原始域名：多线路部署下后端据此判断“这次请求从哪条线路进来”，
        # 从而把 icon_url / 产物直链 / 文档示例里的 origin 换成用户实际访问的那条。
        # 没有这一行，所有响应都会退回配置里的第一条地址（跨线路拉图、跨线路下载）。
        #
        # 必须是 $http_host，**不能是 $host**：$host 会把端口砍掉。
        # 站在 8081 这类非 80/443 端口上时，后端据此推出的 origin 是 http://ip，
        # 而 CSRF 的「完整 origin 比对」拿到的是浏览器发的 http://ip:8081，必然不等
        # —— 登录直接 403「请求来源校验失败」（真机就是这么撞出来的）。
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # 追加：保留上游真实客户端 IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # 产物（图片/视频/音频）本身已压缩，再 gzip 只烧 CPU 不缩体积，
        # 而且会破坏 Range 断点续传的透明性。
        gzip off;
    }

    # index.html 必须每次回源校验。
    #
    # 它引用的是**带内容哈希**的 chunk，而 /assets/ 是 `immutable` 一年。更新后若浏览器
    # 沿用旧 index.html，它要的那批 chunk 已经随镜像一起消失 → 白屏，且用户只会说
    # "更新完打不开了"。用 `expires -1`（而不是 add_header）：location 里只要出现
    # add_header，server 级的三条安全头就会**整体不再继承**。
    location = /index.html {
        expires -1;
    }

    # SPA history fallback：未命中静态资源的路径回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
