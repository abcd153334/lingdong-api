# 灵动 API · 单机部署编排（v2.2.0）
#
#   bash deploy/ld.sh up        # 一条命令：生成配置 → 起 3 个容器 → 等健康
#
# 形态：**3 个容器** —— backend（Go 单进程，前端产物内嵌）、postgres、redis。
# 对外只有**一个端口**：宿主 127.0.0.1:8088（`APP_PORT` 可改）。
# 为什么只有一个：静态页与 API 在同一个进程里，同源，没有第二层反代，
# 也就不存在「转发头配错导致登录 403」这一类故障。
#
# 8088 只绑回环是刻意的：前面必须有一层终止 TLS 的入口，二选一
#   ① 宝塔面板「网站 → 反向代理」→ http://127.0.0.1:8088   （见 deploy/edge/bt/）
#   ② 独立 nginx（deploy/edge/nginx/ 模板 + certbot）        → 同上
# 直接把 8088 暴露到公网 = 同一个站点以明文永久可达；prod 的会话 Cookie 只在
# https 上回传，明文入口的后果是「登录 200、之后全 401」。
#
# 配置入口只有一个：deploy/.env（`ld.sh init` 自动生成，不需要手填）。
# 所有键都从 env_file 整份注入，这里只保留「缺了必须报错」与「需要推导默认值」的项。
name: lingdong-api

services:
  postgres:
    image: postgres:16
    container_name: lingdong-postgres
    restart: unless-stopped
    # 停止预算：给 checkpointer 落完盘的时间。默认 10s 后被 SIGKILL，
    # 表现是"每次重启都要做一次崩溃恢复"（数据不丢，但恢复慢、日志吓人）。
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lingdong}
      # 无默认值：缺了就拒绝启动，而不是静默使用公开的 lingdong/lingdong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须显式配置}
      POSTGRES_DB: ${POSTGRES_DB:-lingdong}
    # 不发布宿主端口：库只在 compose 网络内可达。排障用
    # `docker compose exec postgres psql -U lingdong -d lingdong`，
    # 备份/恢复脚本走的也是 exec，不需要宿主 5432。
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lingdong} -d ${POSTGRES_DB:-lingdong}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - lingdong

  redis:
    image: redis:7
    container_name: lingdong-redis
    restart: unless-stopped
    stop_grace_period: 30s
    # AOF 持久化 + 口令。没有口令时任何能连 6379 的进程都能 SET/DEL 限流键与 leader 锁
    # ——登录锁定、全站限流、worker 选主全在这一个实例里。
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD 必须显式配置}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 必须显式配置}
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - lingdong

  backend:
    # 优先用发布出来的镜像（用户端 `ld.sh up` 只 pull，几十秒起站）；
    # 本地没有该标签时 compose 会自动 build（自建/离线场景不变）。
    # 覆盖镜像：LD_IMAGE=registry.example.com/lingdong-api:vX
    image: "${LD_IMAGE:-ghcr.io/abcd153334/lingdong-api:${TAG:-latest}}"
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args:
        # 版本号注入（-X 只认 var，见 backend.Dockerfile）
        VERSION: "${TAG:-dev}"
    container_name: lingdong-backend
    restart: unless-stopped
    # 优雅退出的最坏路径：HTTP 30s + worker drain 30s + calllog 5s ≈ 65s（见 main.go 关闭段）。
    # 默认 10s 会在第一段就把进程 SIGKILL，在途请求被硬切、结算只能靠回收兜底。
    # 注意：`docker compose down -t 0` 会绕开这个值，升级脚本一律不用 -t。
    stop_grace_period: 90s
    # Postgres 必须就绪：启动即跑迁移/种子，连不上就是一次无效启动。
    # Redis 只要求"已创建"：应用自己把 Redis 当作可降级依赖（连不上只 Warn，30s 探针会自动
    # 恢复）。这里若要求 service_healthy，就把"可降级"变成了"Redis 坏了整站不启动" ——
    # 编排比应用自身契约更严格，是配置错误，不是安全。
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      # 环境变量名与 backend/internal/conf 约定一致。
      # 这里只放两类：① 缺了必须让 compose 直接报错的；② 需要按本编排推导默认值的。
      # 其余一切（模式、时区、代理、指标、留痕口径）都在 .env 里，不再逐项抄一遍。
      APP_ENV: "${APP_ENV:-prod}"
      DATABASE_URL: "${DATABASE_URL:-postgres://lingdong:${POSTGRES_PASSWORD:?}@postgres:5432/lingdong?sslmode=disable}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD 必须显式配置}"
      # APP_ENCRYPTION_KEY 没有默认值，故意用 `:?` 让 compose 直接报错退出：
      # 以前是 `:-0123...` 这种"公开示例值兜底"，忘了配就静默用公开密钥启动 ——
      # 等于任何人读过源码就能解开库内密文（渠道密钥、托管密钥、/v1/media 签名）。
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY 必须显式配置，ld.sh init 会自动生成}"
      # 会话 Cookie 的 Secure 属性：auto（默认）按请求实际协议决定 ——
      # https 走 Secure，明文 http 不加。这样「先在本机 http 验证」与「生产上 TLS」
      # 用同一份配置，不需要用户改环境变量；生产明文时启动日志会打 WARN。
      LD_COOKIE_SECURE: "${LD_COOKIE_SECURE:-auto}"
      # 反代网段。**必须含 127.0.0.1/32**：宝塔/宿主 nginx 把请求转给发布的
      # 127.0.0.1:8088 时，docker-proxy 让容器看到的是 127.0.0.1，并由它追加进 XFF。
      # 后端按 Gin 的规则从右往左找第一个"不可信"地址：不信任回环时取到的就是回环，
      # 于是**每个公网用户都被当成同一个 IP**（限流、验证码升级、IP 白名单、审计全废）。
      # 信任回环是安全的：能伪造 XFF 的只有宿主机上的本机进程。
      # 入口在另一台机器时，把那台机器的地址也加进 .env 的 LD_TRUSTED_PROXIES。
      LD_TRUSTED_PROXIES: "${LD_TRUSTED_PROXIES:-172.29.0.0/24,127.0.0.1/32}"
      STORAGE_DIR: "${STORAGE_DIR:-/app/data}"
      # 演示数据默认不写；想在本机看演示数据时在 .env 里改成 1。
      LD_SEED_ENABLED: "${LD_SEED_ENABLED:-0}"
    # 整套系统**唯一**的宿主端口。
    # 换端口只改 .env 的 APP_PORT，不要改这一行 —— 脚本、体检、文档读同一个变量。
    #
    # 仍绑回环：前面必然还有一层终止 TLS 的入口（宝塔反代 / deploy/edge/ 的独立 nginx）。
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    volumes:
      - storagedata:/app/data
    healthcheck:
      # deep=1 会真的探 DB 与 Redis：进程活着但依赖全挂时，容器不该继续报 healthy
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8080/api/health?deep=1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 6s
      retries: 6
      # 启动期要跑迁移与文档对账，20s 常常不够（不够会被反复 kill 形成启动循环）
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - lingdong

volumes:
  pgdata:
  redisdata:
  storagedata:

networks:
  lingdong:
    driver: bridge
    # 固定网段：LD_TRUSTED_PROXIES 的默认值（172.29.0.0/24）依赖它。
    # 换网段时两个值必须一起改（或显式设 LD_TRUSTED_PROXIES），否则客户端 IP 取错。
    ipam:
      config:
        - subnet: "${LD_SUBNET:-172.29.0.0/24}"
