# 反代头唯一来源。
#
# X-Forwarded-For 用 $proxy_add_x_forwarded_for（**追加**）：
#   后端的 gin 从右往左取第一个不受信任的地址，因此"每一跳都追加、且每跳都在
#   LD_TRUSTED_PROXIES 里"才能拿到真实客户端 IP。
#   少配一跳 → 所有用户塌进同一个限流桶；配 0.0.0.0/0 → 任何人都能伪造来源 IP。

# 用 $http_host 而不是 $host：$host 会**砍掉端口**。入口一旦不在 443（例如临时用
# http://ip:8088 验证、或反代再套一层），后端推出的 origin 就与浏览器发的不一致，
# CSRF 的完整 origin 比对直接 403。默认端口下两者等价，所以永远用 $http_host 更安全。
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;

# 上游 keepalive：短连接会在每次请求上多一次 TCP 握手（网关是高频小请求场景）
proxy_http_version 1.1;
proxy_set_header Connection "";
