# 超时与体积的**唯一来源**（被 lingdong.tls.conf.template 与 api.tls.conf.template include）
#
# 阶梯（从外到内，外层必须严格大于内层）：
#   客户端 SDK ≥ 960s  >  这一层 960s  >  应用同步等待 780s（上限 900s）  >  单次上游 60s
#
# 改动前先读 deploy/edge/README.md 的「三条必须理解的规则」。
# 应用侧的上限在代码里（backend/internal/pkg/syncwait），改动必须两边一起看。

# 与 frps / 内网后端建连：15s 足够，失败要快速暴露而不是挂住
proxy_connect_timeout 15s;

# 等上游首字节：960s —— 覆盖"应用等 780s 才放弃"的最坏路径
proxy_read_timeout 960s;

# 向上游写请求体（大图 multipart）
proxy_send_timeout 960s;

# 向客户端写响应的间隔上限：默认 60s，流式/大响应会被它掐断
send_timeout 960s;

# 不缓冲：图片与 SSE 立即透传；也避免大响应落磁盘
proxy_buffering off;
proxy_request_buffering off;

# 与后端上限对齐（图像 multipart 实测 12MiB）；nginx 默认 1MiB 会在后端看不到请求的情况下 413
client_max_body_size 256m;
