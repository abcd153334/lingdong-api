# 单机调试用覆盖文件（**不要提交为 docker-compose.override.yml**，否则会悄悄生效）
#
# 用法：
#   cp deploy/docker-compose.override.example.yml deploy/docker-compose.override.yml
#   docker compose -f deploy/docker-compose.yml up -d
# 删除 override 文件即回到生产形态。
#
# 生产形态刻意不暴露 5173：它只是开发时的第二个入口，
# 多一个口就多一条"绕过边缘直接访问明文站点"的路。

services:
  web:
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:5173:80"
