# 灵动 API · 多机节点编排（一主站 + N 线路，共用一个库与一个 Redis）—— 可选组件
#
# 单机用户不需要本文件：用 deploy/docker-compose.yml 就够了。
#
# 用法（每台机器执行，项目名区分节点）：
#   docker compose -f deploy/optional/cluster/docker-compose.node.yml -p ld-main up -d
#
# 与单机编排的区别：
#   - 不启动 PostgreSQL / Redis：它们是外部共享依赖，地址由 .env 给；
#   - 不挂本地存储卷：多节点共库时文件必须在对象存储里（LD_CLUSTER_MODE=1 会强制）；
#   - 不写 container_name：同一台机器要能跑多套（`-p` 即隔离）；
#   - 镜像必须给精确 TAG：多节点滚动升级时不能出现"一半新一半 latest"。
#
# v2.2.0 起节点里**没有 nginx 容器**：前端产物内嵌在应用二进制里，
# 「完整节点 / 纯 API 节点」只由 LD_NODE_MODE 决定（api 模式下非 API 路径由应用自己 404）。
# 少一个容器也就少一份会配错的转发头。

services:
  backend:
    image: "${LD_IMAGE:-ghcr.io/abcd153334/lingdong-api:${TAG:?TAG 必须显式指定（禁止 latest）}}"
    build:
      context: ../../..
      dockerfile: deploy/backend.Dockerfile
      args:
        VERSION: "${TAG:?}"
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # 外部依赖：这里不给默认值，避免"忘了配就连本机 localhost"。
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL 必须指向共享主库}"
      REDIS_ADDR: "${REDIS_ADDR:?REDIS_ADDR 必须指向共享 Redis}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD 必须显式配置}"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY 必须与其它节点同值}"
      # 节点角色必须显式声明：主站 full、线路 api。
      # 不给默认值，是因为"用 api 拓扑却忘了改模式"会让线路继续提供门户接口。
      LD_NODE_MODE: "${LD_NODE_MODE:?必须显式写 full 或 api}"
      LD_COOKIE_SECURE: "${LD_COOKIE_SECURE:-auto}"
      # 入口（宿主机 nginx / SLB）与容器同处 172.28.0.0/24；回环同样必须信任
      # （docker-proxy 会让容器看到 127.0.0.1，不信任它则所有用户塌成同一个 IP）。
      LD_TRUSTED_PROXIES: "${LD_TRUSTED_PROXIES:-172.28.0.0/24,127.0.0.1/32}"
      # 集群模式禁用本地盘；这里保留路径只为让 conf 的默认值有落点。
      STORAGE_DIR: "/app/data"
    # 唯一对外端口；TLS 由宿主机入口终止（见 deploy/edge/nginx/api.tls.conf.template）。
    # 每台机器一个 compose 项目，端口冲突时用 .env 的 APP_PORT 覆盖。
    ports:
      - "127.0.0.1:${EDGE_PORT:-8088}:8080"
    healthcheck:
      # deep=1 会真的探 DB 与 Redis：进程活着但依赖全挂时，容器不该继续报 healthy。
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8080/api/health?deep=1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 6s
      retries: 6
      # 首启要跑迁移与种子；多节点同时启动时后到的节点还要等 advisory lock。
      start_period: 180s
    # 先停 HTTP 再停 Worker；长请求按断连处理（不结算）。
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - edge

networks:
  edge:
    driver: bridge
    ipam:
      config:
        # 固定网段：LD_TRUSTED_PROXIES 的默认值依赖它（本机入口 → 后端）。
        # 每台机器一个 compose 项目，跨主机不冲突；同机跑多套时用 -p 区分并各自改网段。
        - subnet: 172.28.0.0/24
