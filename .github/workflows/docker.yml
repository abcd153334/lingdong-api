# 打 tag 即发布镜像 —— 用户端 `ld.sh up --pull` 几十秒起站，不必本地编译。
#
# 为什么要有这条流水线：这是与 new-api 差距最大的一环。此前用户 clone 之后必须
# 在目标机上跑完整构建（拉 Go module + pnpm 依赖 + vite build，首次 4~10 分钟，
# 且依赖 goproxy.cn 与 npm 镜像可达）。有了预构建镜像，部署退化成「拉 → 起」。
#
# 本文件不在部署路径上：它只在 GitHub 侧跑，失败不影响用户。
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（默认取当前 ref 名）"
        required: false
      notes:
        description: "发布说明（默认取 commit 标题）"
        required: false

permissions:
  contents: read
  # GHCR 推送需要写包权限；公开仓库的包默认匿名可拉，用户不需要登录。
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 用 QEMU 模拟。代价是 Go/前端构建慢一些，换来的是不需要维护
      # 两套 runner + manifest 合并（new-api 用的是原生 arm runner，那份复杂度我们不需要）。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 镜像名必须小写；github.repository 已经是小写，这里只是把风险写明白。
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # VERSION 注入到 -X：镜像里的 /api/health.version 必须等于 tag，
          # 否则「回滚后跑的是哪一版」又变成靠猜（v2.1.x 踩过）。
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 清单是管理台「版本与更新」的唯一数据源。在这里生成而不是让发布者手工跑
      # gen-release-manifest.sh，是因为手工那一步有 3 个动作（生成 / 上传 / 在管理台
      # 填地址），漏一个的症状是"发版了但没人收到通知"，而且很难自查。
      #
      # 托管位置选**固定分支的 raw 地址**而不是 release asset：
      # 后端抓清单的 http client 禁重定向（netguard.DenyRedirect），而
      # github.com/.../releases/latest/download/... 是 302 —— 会被判 http_status 拒绝。
      # raw.githubusercontent.com/<repo>/release-manifest/release.json 实测直出 200、零重定向。
      - name: 生成发布清单
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES="${{ inputs.notes }}"
          [ -n "$NOTES" ] || NOTES="$(git log -1 --pretty=%s)"
          # 手写 JSON 时最容易出的事是引号/换行没转义，用 python 生成而不是拼字符串。
          TAG="$TAG" NOTES="$NOTES" COMMIT="$GITHUB_SHA" \
          REPO="${{ github.repository }}" python3 - <<'PY'
          import json, os, datetime
          tag = os.environ["TAG"]
          doc = {
              "schema": 1,
              "latest": {
                  "version": tag,
                  "tag": tag,
                  "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"),
                  "notes": os.environ["NOTES"][:500],
                  "commit": os.environ["COMMIT"],
                  "url": f"https://github.com/{os.environ['REPO']}/releases/tag/{tag}",
              },
          }
          with open("release.json", "w", encoding="utf-8") as f:
              json.dump(doc, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(open("release.json", encoding="utf-8").read())
          PY

      # 单文件分支：只放 release.json（+ 一句来源说明）。用独立临时仓库推送，
      # 不动本 job 的 checkout —— 那是构建上下文，改它的 HEAD 会让缓存键漂移。
      - name: 推送清单到 release-manifest 分支
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          set -euo pipefail
          mkdir -p /tmp/manifest && cp release.json /tmp/manifest/
          cd /tmp/manifest
          cat > README.md <<'MD'
          # 发布清单（自动生成）

          本分支只放 `release.json`，由 `.github/workflows/docker.yml` 在每次推 `v*` tag 时更新。
          请勿手工修改 —— 下一次发布会覆盖。

          清单地址（管理台「系统配置 → 版本与更新」填这个）：
          `https://raw.githubusercontent.com/abcd153334/lingdong-api/release-manifest/release.json`
          MD
          git init -q -b release-manifest
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              add release.json README.md
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "release: $TAG"
          git remote add origin "https://github.com/${{ github.repository }}.git"
          # 用 header 传凭据，避免 token 出现在 URL 里（会进 git 的报错与 reflog）
          AUTH="$(printf 'x-access-token:%s' "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
              push -q --force origin HEAD:release-manifest

      - name: 摘要
        run: |
          {
            echo "### 已发布"
            echo ""
            echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "- \`${{ steps.meta.outputs.image }}:latest\`"
            echo "- 平台：linux/amd64, linux/arm64"
            echo "- 清单：\`https://raw.githubusercontent.com/${{ github.repository }}/release-manifest/release.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
