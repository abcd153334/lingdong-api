# 打 tag 即发布镜像 —— 用户端 `ld.sh up --pull` 几十秒起站，不必本地编译。
#
# 为什么要有这条流水线：这是与 new-api 差距最大的一环。此前用户 clone 之后必须
# 在目标机上跑完整构建（拉 Go module + pnpm 依赖 + vite build，首次 4~10 分钟，
# 且依赖 goproxy.cn 与 npm 镜像可达）。有了预构建镜像，部署退化成「拉 → 起」。
#
# 本文件不在部署路径上：它只在 GitHub 侧跑，失败不影响用户。
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（默认取当前 ref 名）"
        required: false

permissions:
  contents: read
  # GHCR 推送需要写包权限；公开仓库的包默认匿名可拉，用户不需要登录。
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 用 QEMU 模拟。代价是 Go/前端构建慢一些，换来的是不需要维护
      # 两套 runner + manifest 合并（new-api 用的是原生 arm runner，那份复杂度我们不需要）。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 镜像名必须小写；github.repository 已经是小写，这里只是把风险写明白。
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # VERSION 注入到 -X：镜像里的 /api/health.version 必须等于 tag，
          # 否则「回滚后跑的是哪一版」又变成靠猜（v2.1.x 踩过）。
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 摘要
        run: |
          {
            echo "### 已发布"
            echo ""
            echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "- \`${{ steps.meta.outputs.image }}:latest\`"
            echo "- 平台：linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
